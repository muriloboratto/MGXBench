name: MGXBench Python CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r configuration/requirements-viz.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q benchmark.py configuration tests

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
