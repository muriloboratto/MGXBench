name: MGXBench Python CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r configuration/requirements-test.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q benchmark.py configuration tests

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v
